[project]
name = "guardian-engine"
version = "0.1.0"
description = "Portfolio Guardian: deterministic risk engine, replay simulator and Gemini agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "yfinance>=0.2.50",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
